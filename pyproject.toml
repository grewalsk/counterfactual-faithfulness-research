[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "counterfactual-faithfulness"
version = "0.1.0"
description = "Simulator-grounded paired-intervention evaluation for action-conditioned world models."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
cpu = [
  "gym-pusht==0.1.6",
  "gymnasium==1.3.0",
  "pymunk==6.8.0",
  "pytest==8.3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

